name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecg_edu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and e2e tests
        run: npm run test -w @ecg-edu/api -- --runInBand

      - name: PostgreSQL repository and runtime integration
        run: npm run test:postgres
        env:
          PG_TEST_URL: postgresql://postgres:test-only-password@localhost:5432/ecg_edu_test
          NODE_ENV: test

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Authenticated browser flow
        run: npm run test:auth:web
