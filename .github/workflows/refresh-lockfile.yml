name: Refresh lockfile

on:
  push:
    branches:
      - feat/clinical-learning-foundation-20260923
    paths:
      - package.json
      - apps/web/package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild package-lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(web): dedupe React runtime in lockfile"
          git push origin HEAD:feat/clinical-learning-foundation-20260923
